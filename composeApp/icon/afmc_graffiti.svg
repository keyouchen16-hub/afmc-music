<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <filter id="spray" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#1A1A1A"/>
  <circle cx="50" cy="48" r="28" fill="#FF2E88" opacity="0.55" filter="url(#spray)"/>
  <g transform="rotate(-8 50 50)">
    <!-- 1. 字的黑色描边 -->
    <text x="50" y="58" text-anchor="middle" font-family="Sedgwick Ave Display" font-size="34"
          fill="#000000" stroke="#000000" stroke-width="1.6">AFMC</text>
    <!-- 2. 滴漆（带黑边，顶部伸进字母里） -->
    <g fill="#FFFFFF" stroke="#000000" stroke-width="0.8">
      <rect x="30.8" y="51" width="2.4" height="17" rx="1.2"/><circle cx="32" cy="68.5" r="1.9"/>
      <rect x="49" y="53" width="2.2" height="11" rx="1.1"/><circle cx="50.1" cy="64.5" r="1.6"/>
      <rect x="67.4" y="50" width="2.2" height="14" rx="1.1"/><circle cx="68.5" cy="64.5" r="1.7"/>
    </g>
    <!-- 3. 字的白色，盖住滴漆顶部的接缝 -->
    <text x="50" y="58" text-anchor="middle" font-family="Sedgwick Ave Display" font-size="34"
          fill="#FFFFFF">AFMC</text>
  </g>
  <path d="M20 80 Q48 88 76 74" fill="none" stroke="#FFD400" stroke-width="3" stroke-linecap="round"/>
  <path d="M72 70 L80 72 L75 79 Z" fill="#FFD400"/>
</svg>
